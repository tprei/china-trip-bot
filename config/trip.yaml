# Who travels, from where, when, and the rules the ranking follows.
# Adding a person from an existing origin is one line under `people`.

timezone: America/Sao_Paulo   # summary and reminders follow Brasília time
home_currency: EUR

origins:
  DUB: {city: Dublin, airports: [DUB], currency: EUR}
  LON: {city: London, airports: [LHR, LGW], currency: GBP}
  SAO: {city: São Paulo, airports: [GRU], currency: BRL}   # VCP has no China service
  MEX: {city: Mexico City, airports: [MEX], currency: MXN}  # dormant until someone joins

groups:   # a group always books the same flights
  - {id: thiago, name: Thiago, origin: DUB, people: [Thiago]}
  - {id: lon, name: Luísa + Gabi, origin: LON, people: [Luísa, Gabi]}
  - {id: sao, name: David + Mari, origin: SAO, people: [David, Mari]}

windows:  # days on the ground in China, first to last
  - {id: C, start: 2027-08-09, end: 2027-08-20}
  - {id: A, start: 2027-08-23, end: 2027-09-03}
  - {id: B, start: 2027-08-30, end: 2027-09-10}

flex:     # free days around a window that cost no leave
  outbound_days_before: 2   # leave Sat or Sun, land by the first day
  return_days_after: 2      # fly home Fri, Sat or Sun

china_airports:   # mainland only; the city each airport serves
  PEK: beijing
  PKX: beijing
  PVG: shanghai
  SHA: shanghai
  CAN: guangzhou
  SZX: shenzhen
  CSX: changsha
  KWL: guilin
  TFU: chengdu
  CKG: chongqing
  XIY: xian
  HGH: hangzhou
  WUH: wuhan

flights:
  max_stops: 1                # same-plane stops count (CA898 via MAD, CZ8032 via TIJ)
  max_layover_hours: 8
  blocked_airports: [AMM, SVO, DME, VKO, LED]   # Jordan, Russia
  allow_self_transfer: false

fairness:
  max_price_overshoot_pct: 25   # vs the group's own best option in the window
  max_time_overshoot_hours: 6

route:
  stops: [beijing, shanghai, zhangjiajie, yangshuo]   # the main plan
  nights: {beijing: 3, shanghai: 2, zhangjiajie: 2, yangshuo: 3}
  value_of_time_eur_per_hour: 20      # daytime hours spent moving
  weather_eur_per_risk_night: 15      # per person-night at full risk
  prefer_sleepers_eur: 40             # comfort: a sleeper beats a similar day leg
  alternatives:                       # only for /other
    - {id: no-zhangjiajie, label: Without Zhangjiajie, drop: zhangjiajie}
    - {id: no-shanghai, label: Without Shanghai, drop: shanghai}
    - {id: no-yangshuo, label: Without Yangshuo, drop: yangshuo}

alerts:
  drop_pct: 5          # vs the total in the last weekly summary
  record_low: true

summary:
  weekday: sunday
  time: "09:00"

budgets:   # searches per night
  google: 150
  serpapi: 8
  tripcom: 12

# Only used until the first ECB download succeeds.
fallback_rates_per_eur: {GBP: "0.87", BRL: "6.30", USD: "1.08", MXN: "21.00", CNY: "7.80"}
