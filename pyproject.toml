[project]
name = "tripbot"
version = "0.1.0"
description = "Flight price tracker and Telegram bot for the China 2027 group trip"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "faster-flights==3.8.0",
  "httpx>=0.28",
  "jinja2>=3.1",
  "playwright==1.63.0",
  "pyyaml>=6.0",
  "tzdata>=2024.1",
]

[project.scripts]
tripbot = "tripbot.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Display text uses typographic dashes and the minus sign on purpose.
allowed-confusables = ["–", "−", "×"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
