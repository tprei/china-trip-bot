# What each city is like and what to see there, for /about. Written in the
# group's language, like the city names in cities.yaml. Every city the route
# can touch has an entry, so a stop added from Telegram is covered too.

beijing:
  summary: Capital imperial por mais de seis séculos, com palácios, hutongs e o trecho mais famoso da Grande Muralha a 1h30 de carro.
  sights:
    - Grande Muralha em Mutianyu, com teleférico e tobogã na descida
    - Cidade Proibida e Praça da Paz Celestial
    - Templo do Céu, de manhã cedo com os moradores no parque
    - Palácio de Verão e o lago Kunming
    - Hutongs de Shichahai e pato laqueado no jantar

shanghai:
  summary: A maior cidade da China, onde o Bund dos anos 1920 fica de frente para os arranha-céus de Pudong.
  sights:
    - O Bund à noite, com Pudong iluminado do outro lado do rio
    - Mirante da Shanghai Tower, o prédio mais alto da China
    - Jardim Yu e a cidade antiga
    - Ruas arborizadas da antiga Concessão Francesa
    - Xiaolongbao, o pastel de sopa de Xangai

zhangjiajie:
  summary: Parque nacional de colunas de arenito que inspiraram as montanhas flutuantes de Avatar; pede dois dias de trilhas e teleféricos.
  sights:
    - Parque Florestal de Wulingyuan, Patrimônio da UNESCO
    - Elevador Bailong, 326 m colado no penhasco
    - Yuanjiajie e a Montanha Avatar Aleluia
    - Montanha Tianmen, com teleférico longo, Portão do Céu e passarela de vidro
    - Ponte de vidro do Grand Canyon de Zhangjiajie

yangshuo:
  summary: Vilarejo entre morros de calcário à beira do rio Li; o lugar para pedalar, descer de balsa de bambu e ver o pôr do sol.
  sights:
    - Rio Li de barco entre Xingping e Yangshuo, a paisagem da nota de 20 yuan
    - Balsa de bambu no rio Yulong
    - Bicicleta pelos arrozais e vilarejos
    - Nascer do sol no mirante do Pico Xianggong
    - Show Impressão Liu Sanjie, montado no próprio rio

guilin:
  summary: Porta de entrada do rio Li, com morros de calcário no meio da cidade e cavernas iluminadas.
  sights:
    - Colina da Tromba do Elefante
    - Caverna da Flauta de Junco
    - Terraços de arroz de Longji, a 2h
    - Lagos do centro iluminados à noite

guangzhou:
  summary: A antiga Cantão, berço da culinária cantonesa e do dim sum; quente, moderna e fácil de cruzar de metrô.
  sights:
    - Torre de Cantão e passeio noturno pelo rio das Pérolas
    - Ilha Shamian e os prédios coloniais
    - Casa Ancestral da Família Chen
    - Dim sum de manhã numa casa de chá cantonesa

shenzhen:
  summary: Vila de pescadores que virou metrópole de tecnologia em quatro décadas, colada em Hong Kong.
  sights:
    - Mercado de eletrônicos de Huaqiangbei
    - Mirante do Ping An Finance Centre
    - Galerias e cafés do OCT Loft
    - Parque Lianhuashan com vista do centro

changsha:
  summary: Capital de Hunan, terra de Mao e de uma das cozinhas mais apimentadas da China; parada natural a caminho de Zhangjiajie.
  sights:
    - Ilha das Laranjeiras e a cabeça gigante do jovem Mao
    - Montanha Yuelu e a Academia Yuelu, com mil anos
    - Museu Provincial de Hunan e os tesouros de Mawangdui
    - Tofu fedido e petiscos na rua Pozi

chengdu:
  summary: Capital de Sichuan, de pandas, casas de chá e da pimenta que adormece a boca.
  sights:
    - Base de pesquisa dos pandas-gigantes, chegando cedo
    - Ruelas de Kuanzhai Xiangzi
    - Chá e massagem de ouvido no Parque do Povo
    - Buda Gigante de Leshan, a 1h de trem-bala
    - Hot pot sichuanês

chongqing:
  summary: Megacidade em morros sobre os rios Yangtzé e Jialing, com metrô atravessando prédio e noites de cara cyberpunk.
  sights:
    - Hongyadong iluminado à noite
    - Monotrilho que atravessa um prédio em Liziba
    - Teleférico sobre o Yangtzé
    - Cidade antiga de Ciqikou
    - Hot pot de Chongqing, ainda mais forte que o de Chengdu

xian:
  summary: Ponto de partida da Rota da Seda e capital de mais de dez dinastias; o Exército de Terracota fica a 1h.
  sights:
    - Exército de Terracota
    - Volta de bicicleta sobre a muralha da cidade, 14 km
    - Bairro muçulmano e a comida de rua
    - Pagode do Grande Ganso Selvagem

hangzhou:
  summary: Jardins, templos e chá em volta do Lago Oeste, a uma hora de trem-bala de Xangai.
  sights:
    - Lago Oeste de barco ou bicicleta pela Calçada Su
    - Plantações de chá Longjing
    - Templo Lingyin e as esculturas na rocha
    - Pagode Leifeng ao pôr do sol

wuhan:
  summary: Grande cidade às margens do Yangtzé e o principal entroncamento ferroviário do centro da China.
  sights:
    - Torre do Grou Amarelo
    - Lago Leste de bicicleta
    - Rua Hubu e o macarrão reganmian no café da manhã
